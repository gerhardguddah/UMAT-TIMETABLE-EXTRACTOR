<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMaT Timetable Extractor</title>
    
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        /* UI Styling - Kept Blue/White Theme */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f4f4f9; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { margin-top: 0; color: #004085; }
        
        /* Input Controls */
        .controls { margin-bottom: 20px; padding: 20px; background: #e1ecf4; border-radius: 8px; display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: bold; font-size: 0.9em; color: #555; }
        input[type="text"] { padding: 10px; border: 1px solid #ccc; border-radius: 6px; min-width: 120px; }
        input[type="file"] { padding: 8px; background: white; border-radius: 6px; border: 1px solid #ccc; }
        
        button { color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9em; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }

        /* The Timetable Grid */
        .table-wrapper { overflow-x: auto; margin-top: 20px; border-radius: 8px; border: 1px solid #ddd; background: white; padding: 5px;}
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        
        /* Headers (Times) */
        th { background-color: #007bff; color: white; padding: 12px; text-align: center; border: 1px solid #0062cc; white-space: nowrap; }
        
        /* First Column (Days) */
        td:first-child { background-color: #f8f9fa; font-weight: bold; width: 100px; text-align: center; border-right: 2px solid #ddd; }
        
        /* Cells */
        td { border: 1px solid #dee2e6; padding: 8px; vertical-align: top; height: 80px; font-size: 0.9em; min-width: 120px; }
        tr:nth-child(even) td:not(:first-child) { background-color: #fdfdfd; }
        
        /* Class Blocks */
        .class-block { 
            background: #e3f2fd; color: #004085; 
            padding: 6px; margin-bottom: 4px; border-radius: 4px; 
            border-left: 4px solid #007bff; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .class-room { font-weight: bold; font-size: 0.85em; color: #d63384; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 UMaT Timetable Extractor </h1>
    <p>GG</p>
    <h4> NB ⚠️ Always specify your class section (2A, 2B, 3A, 3B etc.) to see the correct classes.</h4>

    <div class="controls">
        <div class="input-group">
            <label>1. Upload Excel File</label>
            <input type="file" id="upload" accept=".xlsx, .xls" />
        </div>
        
        <div class="input-group">
            <label>2. COURSE NAME</label>
            <input type="text" id="deptCode" value="CE" placeholder="e.g. CE">
        </div>

        <div class="input-group">
            <label>3. Year/Stream</label>
            <input type="text" id="streamCode" value="3A" placeholder="e.g. 3A, 3B">
        </div>

        <button onclick="processFile()" style="background: #007bff;">Generate Table</button>
        
        <div style="margin-left: auto; display: flex; gap: 8px;">
            <button onclick="downloadExcel()" style="background: #217346;">Excel (Grid)</button>
            <button onclick="downloadImage()" style="background: #6610f2;">Image (Phone)</button>
            <button onclick="downloadPDF()" style="background: #dc3545;">PDF</button>
        </div>
    </div>

    <div id="status"></div>
    
    <div class="table-wrapper" id="captureArea">
        <table id="timetableGrid">
            <thead id="gridHead"></thead>
            <tbody id="gridBody"></tbody>
        </table>
    </div>
</div>

<script>
    let extractedData = [];
    let timeSlots = new Set(); 

    async function processFile() {
        const fileInput = document.getElementById('upload');
        const deptCode = document.getElementById('deptCode').value.toUpperCase().trim();
        const streamCode = document.getElementById('streamCode').value.toUpperCase().trim();
        
        if (!fileInput.files.length) {
            alert("Please select a file first!");
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            
            extractedData = [];
            timeSlots = new Set();

            workbook.SheetNames.forEach(sheetName => {
                if (sheetName.toLowerCase().includes("summary")) return;
                const sheet = workbook.Sheets[sheetName];
                const range = XLSX.utils.decode_range(sheet['!ref']);

                // Scan Headers
                for (let C = 2; C <= range.e.c; ++C) {
                    const timeCell = sheet[XLSX.utils.encode_cell({c:C, r:6})]; 
                    if (timeCell && timeCell.v) {
                        timeSlots.add(timeCell.v.toString().trim());
                    }
                }

                // Scan Data
                for (let R = 7; R <= range.e.r; ++R) { 
                    for (let C = 2; C <= range.e.c; ++C) { 
                        const cell = sheet[XLSX.utils.encode_cell({c:C, r:R})];
                        
                        if (cell && cell.v) {
                            let cellText = String(cell.v).toUpperCase();
                            let match = false;
                            
                            if (cellText.includes(deptCode)) {
                                if (streamCode === "") {
                                    match = true;
                                } else {
                                    if (cellText.includes(streamCode)) match = true;
                                }
                            }

                            if (match) {
                                const timeVal = sheet[XLSX.utils.encode_cell({c:C, r:6})].v.trim();
                                const roomVal = sheet[XLSX.utils.encode_cell({c:0, r:R})] ? sheet[XLSX.utils.encode_cell({c:0, r:R})].v : "Unknown";

                                extractedData.push({
                                    day: sheetName,
                                    time: timeVal,
                                    room: roomVal,
                                    details: cell.v
                                });
                            }
                        }
                    }
                }
            });
            buildGrid();
        };
        reader.readAsArrayBuffer(file);
    }

    function buildGrid() {
        const thead = document.getElementById('gridHead');
        const tbody = document.getElementById('gridBody');
        thead.innerHTML = "";
        tbody.innerHTML = "";

        if (extractedData.length === 0) {
            alert("No classes found. Check your codes.");
            return;
        }

        let sortedTimes = Array.from(timeSlots).sort(); 
        
        let headerRow = "<tr><th>Day</th>";
        sortedTimes.forEach(time => { headerRow += `<th>${time}</th>`; });
        headerRow += "</tr>";
        thead.innerHTML = headerRow;

        const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
        
        days.forEach(day => {
            let tr = document.createElement("tr");
            let tdDay = document.createElement("td");
            tdDay.innerText = day;
            tr.appendChild(tdDay);

            sortedTimes.forEach(time => {
                let td = document.createElement("td");
                let classes = extractedData.filter(d => d.day === day && d.time === time);
                
                if (classes.length > 0) {
                    classes.forEach(c => {
                        let div = document.createElement("div");
                        div.className = "class-block";
                        div.innerHTML = `<span class="class-room">📍 ${c.room}</span><span class="class-details">${c.details}</span>`;
                        td.appendChild(div);
                    });
                }
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    // 3. ADDED: New Download Functions

    // Option A: Excel (Preserves the Grid Layout)
    function downloadExcel() {
        if(extractedData.length === 0) { alert("Generate the table first!"); return; }
        
        // Grab the HTML Table directly
        let table = document.getElementById("timetableGrid");
        let wb = XLSX.utils.table_to_book(table, {sheet: "Schedule"});
        XLSX.writeFile(wb, "UMaT_Timetable.xlsx");
    }

    // Option B: Image (Best for Phones)
    function downloadImage() {
        if(extractedData.length === 0) { alert("Generate the table first!"); return; }
        
        const element = document.getElementById("captureArea");
        
        html2canvas(element).then(canvas => {
            const link = document.createElement("a");
            link.download = 'my_timetable.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    // Option C: PDF (Standard Document)
    function downloadPDF() {
        if(extractedData.length === 0) { alert("Generate the table first!"); return; }
        
        const element = document.getElementById("captureArea");
        const { jsPDF } = window.jspdf;

        html2canvas(element).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            // A4 Landscape size logic
            const pdf = new jsPDF('l', 'mm', 'a4');
            const imgProps = pdf.getImageProperties(imgData);
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
            
            pdf.addImage(imgData, 'PNG', 0, 10, pdfWidth, pdfHeight);
            pdf.save("timetable.pdf");
        });
    }
</script>

</body>
</html>
